name: Refresh lab card

on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC (08:17 in Dubai)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lab-card
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Stdlib Python only: no installs. Each API section falls back to data/lab.json on failure.
      - name: Build widgets from live GitHub and npm data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/build_assets.py

      - name: Commit only if the card changed
        run: |
          if [ -z "$(git status --porcelain -- assets data)" ]; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data
          git commit -m "lab card: refresh $(date -u +%F)"
          git pull --rebase --autostash
          git push
